<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template</title>
    <!-- css link -->
    <link rel="stylesheet" href="/asstes/css/style.css" />
    <!--tailwind css link -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>

    <header class="relative z-50">
      <!-- topbar -->
      <section
        class="relative w-full py-4 md:py-6 h-32"
        style="
          background-image: url(./asstes/image/nav-img/nav-bg.png);
          background-size: cover;
          background-position: center;
        "
      >
        <div class="container mx-auto px-4 2xl:px-0 flex flex-col xl:flex-row items-center justify-between gap-2 lg:gap-6">
          <!-- text div -->
          <div
            class="flex flex-col text-white sm:flex-row flex-wrap items-center justify-center gap-3 sm:gap-4 lg:gap-5"
          >
            <!-- location -->
            <div class="flex items-center gap-2">
              <img
                class="w-5 h-5 object-contain shrink-0"
                src="./asstes/image/nav-img/location.png"
                alt="location"
              />

              <h5 class="text-base whitespace-nowrap">
                123 Business Street, kolkata, NY 10001, IND
              </h5>
            </div>

            <!-- separator -->
            <div class="hidden sm:block h-5 w-px bg-white"></div>

            <!-- GMAIL -->
            <div class="hidden sm:flex items-center gap-2  ">
              <img
                class="w-5 h-5 object-contain shrink-0"
                src="./asstes/image/nav-img/gmail.png"
                alt="gmail"
              />

              <h5 class="text-base whitespace-nowrap">hello@leadsgorilla.io</h5>
            </div>

            <!-- separator -->
            <div class="hidden sm:block h-5 w-px bg-white "></div>

            <div class="hidden lg:flex items-center gap-2  ">
              <img
                class="w-5 h-5 object-contain shrink-0"
                src="./asstes/image/nav-img/gmail.png"
                alt="gmail"
              />

              <h5 class="text-base whitespace-nowrap">Mon - Fri: 09:00 AM - 6:00 PM</h5>
            </div>
            <!-- clock -->
            
          </div>

          <!-- icon div -->
          <div class="flex items-center gap-5 hidden lg:flex  sm:gap-8 lg:gap-10">
            <h4 class="text-white text-base whitespace-nowrap">Follow Us:</h4>

            <div class="flex items-center gap-3">
              <!-- Facebook -->
              <div
                class="w-10 h-10 sm:w-12 sm:h-12 p-px rounded-full bg-gradient-to-b from-[#06D86E] to-[#003382]"
              >
                <div
                  class="w-full h-full rounded-full bg-black flex items-center justify-center"
                >
                  <img
                    class="w-6 h-6 sm:w-7 sm:h-7 object-contain"
                    src="./asstes/image/nav-img/fb.png"
                    alt="facebook"
                  />
                </div>
              </div>

              <!-- Instagram -->
              <div
                class="w-10 h-10 sm:w-12 sm:h-12 p-px rounded-full bg-gradient-to-b from-[#06D86E] to-[#003382]"
              >
                <div
                  class="w-full h-full rounded-full bg-black flex items-center justify-center"
                >
                  <img
                    class="w-6 h-6 sm:w-7 sm:h-7 object-contain"
                    src="./asstes/image/nav-img/insta.png"
                    alt="instagram"
                  />
                </div>
              </div>

              <!-- LinkedIn -->
              <div
                class="w-10 h-10 sm:w-12 sm:h-12 p-px rounded-full bg-gradient-to-b from-[#06D86E] to-[#003382]"
              >
                <div
                  class="w-full h-full rounded-full bg-black flex items-center justify-center"
                >
                  <img
                    class="w-6 h-6 sm:w-7 sm:h-7 object-contain"
                    src="./asstes/image/nav-img/linkedin.png"
                    alt="linkedin"
                  />
                </div>
              </div>
            </div>
        </div>
      </section>
      <!-- navbar -->
      <div class="absolute top-14 px-4 2xl:px-0 lg:top-6 translate-y-1/2 left-0 right-0 z-50 container mx-auto">
  <!-- Navbar wrapper with outer blur glow -->
  <div class="rounded-3xl md:rounded-full p-[1px] bg-gradient-to-r from-[#06D86E] via-[#012B9E] to-[#012B9E] shadow-[0_0_25px_rgba(1,43,158,0.6)]">
    
    <!-- Main Navbar with inner thin border -->
    <nav class="w-full rounded-3xl md:rounded-full bg-gradient-to-r from-[#06D86E] to-[#012B9E] relative border border-white/20 backdrop-blur-sm">
      <div class="flex items-center justify-between p-3">
        
        <!-- Logo -->
        <div class="relative shrink-0">
          <div class="relative flex items-center justify-center rounded-full bg-white w-24 h-16 sm:w-32 sm:h-24 lg:w-40 lg:h-20 shadow-[0_0_15px_rgba(6,216,110,0.3)]">
            <img
              class="w-full h-28 object-contain p-2"
              src="./asstes/image/nav-img/logo.png"
              alt="logo"
            />
          </div>
        </div> 

        <!-- Desktop Menu -->
        <div class="hidden md:flex items-center justify-center gap-6 lg:gap-10 text-white text-base lg:text-lg h-full py-2">
          
          <div class="relative flex flex-col items-center cursor-pointer pb-2">
            <span class="font-medium text-white">Home</span>
            <div class="absolute -bottom-2.5 flex flex-col items-center w-20">
              <span class="w-3 h-3 bg-[#012B9E] border border-[#67FFB3]/50 rounded-full z-10"></span>
              <span class="w-full h-2 rounded-full bg-gradient-to-r from-transparent via-[#67FFB3] to-transparent  -mt-[4px] "></span>
            </div>
          </div>

          <p class="cursor-pointer hover:text-white/80 transition-all duration-200">Features</p>
          <p class="cursor-pointer hover:text-white/80 transition-all duration-200">Login</p>
          <p class="cursor-pointer hover:text-white/80 transition-all duration-200">Support</p>
          <p class="cursor-pointer hover:text-white/80 transition-all duration-200">Awards</p>
          <p class="cursor-pointer hover:text-white/80 transition-all duration-200">News</p>
        </div> 

        <!-- Action Area: Get Started + Mobile Menu Toggle -->
        <div class="flex items-center gap-3 shrink-0">
          <!-- Get Started -->
          <button class="hidden md:flex items-center gap-2 rounded-full bg-white px-5 py-3 sm:px-6 text-[#003382] font-semibold transition-all duration-300 hover:scale-105 shadow-[0_0_25px_rgba(6,216,110,0.8)] border border-green-300/50">
            <span class="whitespace-nowrap">Get Started</span>
            <img
              class="w-6 h-6 object-contain"
              src="./asstes/image/nav-img/shopping.png"
              alt="log-btn"
            />
          </button>

          <!-- Mobile Menu Button -->
          <button id="mobile-menu-btn" class="md:hidden text-white p-2 pr-4 focus:outline-none">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://w3.org">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
        </div> 
      </div>

      <!-- Mobile Menu Container -->
      <div id="mobile-menu" class="hidden md:hidden absolute top-full left-0 w-full mt-2 bg-white rounded-2xl shadow-xl pb-6 pt-5 px-6 z-50 border border-gray-100">
        <div class="flex flex-col items-center gap-4 text-gray-800 text-base sm:text-lg font-medium">
          <p class="cursor-pointer hover:text-[#06D86E]">Home</p>
          <p class="cursor-pointer hover:text-[#06D86E]">Features</p>
          <p class="cursor-pointer hover:text-[#06D86E]">Login</p>
          <p class="cursor-pointer hover:text-[#06D86E]">Support</p>
          <p class="cursor-pointer hover:text-[#06D86E]">Awards</p>
          <p class="cursor-pointer hover:text-[#06D86E]">News</p>
          
          <!-- Get Started -->
          <button class="mt-4 w-full justify-center flex items-center gap-2 rounded-full bg-[#003382] px-6 py-3 text-white font-semibold shadow-[0_0_20px_rgba(6,216,110,0.95)]">
            <span class="whitespace-nowrap">Get Started</span>
            <img
              class="w-6 h-6 object-contain brightness-0 invert"
              src="./asstes/image/nav-img/shopping.png"
              alt="log-btn"
            />
          </button>
        </div>
      </div>
    </nav>
  </div>
</div>


        </header>

        <main class="relative">
          <!-- banner -->
      <section
        class="flex items-center relative w-full"
        style="
          background-image: url(./asstes/image/banner/dark-bg.png);
          background-size: cover;
          background-position: center;
          background-repeat: no-repeat;
        "
      >
        <div
          class="flex items-center w-full py-16"
          style="
            background-image: url(./asstes/image/banner-img/banner-bg.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
          "
        >
          <div class="flex container px-4 2xl:px-0 mx-auto flex-col md:flex-row items-center justify-between  gap-10 md:gap-4 mt-12 md:mt-8">
            <!-- text div -->
            <div class="relative flex flex-col items-center">
              <!-- Contact Us --> 
              <h2 class="text-5xl md:text-4xl lg:text-7xl font-bold text-white text-center">
                Latest <span class="text-[#06D86E]">Blog</span>
              </h2>

              <!-- Button -->
              <div class="relative mt-6 md:mt-2">
                <img class="w-full" src="./asstes/image/banner-img/banner-btn.png" alt="">

                <h2 class="absolute inset-0 lg:-top-4 -top-2 flex items-center justify-center font-medium text-xl md:text-2xl lg:text-4xl text-white">
                  Home | Latest Blog
                </h2>
              </div>
            </div>

            <!-- img div -->
            <div class="hidden sm:block w-48 sm:w-64 md:w-auto">
              <img class="w-full md:w-60 lg:w-auto drop-shadow-[0_0_20px_#06D86E] drop-shadow-[0_0_45px_#06D86E]" src="./asstes/image/blog-img/blog-banner-img.png" alt="">
            </div>
          </div>
        </div>
          <div class="absolute bottom-0 w-full ">

          <img class="w-full" src="./asstes/image/blog-details-img/banner-bottom-img.png" alt="">
        </div>

      </section>
      <!-- white img -->
    

        <!-- details section -->
         <section class=" container mx-auto px-4 2xl:px-0 mt-4">
          <div class="">
            <img class="w-2xl h-92 " src="./asstes/image/blog-details-img/details-img.png" alt="">
          </div>
          <p class="lg:text-5xl md:text-4xl text-3xl text-black w-full lg:w-2/4  mt-4">Local Business Lead Generation for  Web Designers</p>
         </section>
        </main>
    <!-- js link -->
    <script src="./asstes/js/script.js"></script>
  </body>
</html>
