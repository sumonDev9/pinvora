<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template</title>
    <!-- css link -->
    <link rel="stylesheet" href="/asstes/css/style.css" />
    <!--tailwind css link -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {},
          container: {
            center: true,
            padding: '1rem',
            screens: {
              sm: '100%',
              md: '100%',
              lg: '1024px',
              xl: '1200px',
            },
          }
        }
      }
    </script>
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="relative z-50">
      <!-- topbar -->
    

      <section
        class="relative w-full py-4 md:py-6 h-32"
        style="
          background-image: url(./asstes/image/nav-img/nav-bg.png);
          background-size: cover;
          background-position: center;
        "
      >
        <div class="container mx-auto flex flex-col xl:flex-row items-center justify-between gap-2 lg:gap-6">
          <!-- text div -->
          <div
            class="flex flex-col text-white sm:flex-row flex-wrap items-center justify-center gap-3 sm:gap-4 lg:gap-5"
          >
            <!-- location -->
            <div class="flex items-center gap-2">
              <img
                class="w-5 h-5 object-contain shrink-0"
                src="./asstes/image/nav-img/location.png"
                alt="location"
              />

              <h5 class="text-base whitespace-nowrap">
                123 Business Street, kolkata, NY 10001, IND
              </h5>
            </div>

            <!-- separator -->
            <div class="hidden sm:block h-5 w-px bg-white"></div>

            <!-- GMAIL -->
            <div class="hidden sm:flex items-center gap-2  ">
              <img
                class="w-5 h-5 object-contain shrink-0"
                src="./asstes/image/nav-img/gmail.png"
                alt="gmail"
              />

              <h5 class="text-base whitespace-nowrap">hello@leadsgorilla.io</h5>
            </div>

            <!-- separator -->
            <div class="hidden sm:block h-5 w-px bg-white "></div>

            <div class="hidden lg:flex items-center gap-2  ">
              <img
                class="w-5 h-5 object-contain shrink-0"
                src="./asstes/image/nav-img/gmail.png"
                alt="gmail"
              />

              <h5 class="text-base whitespace-nowrap">Mon - Fri: 09:00 AM - 6:00 PM</h5>
            </div>
            <!-- clock -->
            
          </div>

          <!-- icon div -->
          <div class="flex items-center gap-5 sm:gap-8 lg:gap-10">
            <h4 class="text-white text-base whitespace-nowrap">Follow Us:</h4>

            <div class="flex items-center gap-3">
              <!-- Facebook -->
              <div
                class="w-10 h-10 sm:w-12 sm:h-12 p-px rounded-full bg-gradient-to-b from-[#06D86E] to-[#003382]"
              >
                <div
                  class="w-full h-full rounded-full bg-black flex items-center justify-center"
                >
                  <img
                    class="w-6 h-6 sm:w-7 sm:h-7 object-contain"
                    src="./asstes/image/nav-img/fb.png"
                    alt="facebook"
                  />
                </div>
              </div>

              <!-- Instagram -->
              <div
                class="w-10 h-10 sm:w-12 sm:h-12 p-px rounded-full bg-gradient-to-b from-[#06D86E] to-[#003382]"
              >
                <div
                  class="w-full h-full rounded-full bg-black flex items-center justify-center"
                >
                  <img
                    class="w-6 h-6 sm:w-7 sm:h-7 object-contain"
                    src="./asstes/image/nav-img/insta.png"
                    alt="instagram"
                  />
                </div>
              </div>

              <!-- LinkedIn -->
              <div
                class="w-10 h-10 sm:w-12 sm:h-12 p-px rounded-full bg-gradient-to-b from-[#06D86E] to-[#003382]"
              >
                <div
                  class="w-full h-full rounded-full bg-black flex items-center justify-center"
                >
                  <img
                    class="w-6 h-6 sm:w-7 sm:h-7 object-contain"
                    src="./asstes/image/nav-img/linkedin.png"
                    alt="linkedin"
                  />
                </div>
              </div>
            </div>
        </div>
      </section>
      <!-- navbar -->
      <div class="absolute top-14 lg:top-6 translate-y-1/2 left-0 right-0 z-50 container mx-auto">
        <nav
          class="w-full rounded-full shadow-lg bg-gradient-to-r from-[#06D86E] to-[#012B9E]"
        >
        <div class="flex items-center justify-between p-3">
          <!-- Logo -->
           <div class="relative shrink-0">
            <div
              class="relative flex items-center justify-center rounded-full bg-white w-24 h-16 sm:w-32 sm:h-24 lg:w-40 lg:h-20"
            >
              <img
                class="w-full h-28 object-contain p-2"
                src="./asstes/image/nav-img/logo.png"
                alt="logo"
              />
            </div>
          </div> 

          <!-- Menu -->
          <div
            class="hidden md:flex items-center justify-center gap-6 lg:gap-10 text-white text-base lg:text-lg"
          >
            <p>Home</p>
            <p>Features</p>
            <p>Login</p>
            <p>Support</p>
            <p>Awards</p>
            <p>News</p>
          </div> 

          <!-- Get Started -->
           <div class="shrink-0">
            <button
              class="flex items-center gap-2 rounded-full bg-white px-4 py-3 sm:px-6 sm:py-4 text-[#003382]"
            >
              <span class="whitespace-nowrap">Get Started</span>

              <img
                class="w-6 h-6 object-contain"
                src="./asstes/image/nav-img/shopping.png"
                alt="log-btn"
              />
            </button>
          </div> 
        </div>
        </nav>
      </div>
    </header>
    <main>
      <!-- banner -->
      <section
        class="flex items-center w-full"
        style="
          background-image: url(./asstes/image/banner/dark-bg.png);
          background-size: cover;
          background-position: center;
          background-repeat: no-repeat;
        "
      >
        <div
          class="flex items-center w-full py-16 md:py-24 lg:py-32"
          style="
            background-image: url(./asstes/image/banner-img/banner-bg.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
          "
        >
          <div
            class="flex container mx-auto flex-col md:flex-row items-center justify-between gap-10 md:gap-0 mt-12 md:mt-8"
          >
            <!-- text div -->
            <div class="relative flex flex-col items-center">
              <!-- Contact Us -->
              <h2
                class="text-5xl md:text-6xl lg:text-7xl font-bold text-white text-center"
              >
                CONTACT <span class="text-[#06D86E]">US</span>
              </h2>

              <!-- Button -->
              <div class="relative mt-6 md:mt-2">
                <img
                  class="w-56 md:w-auto"
                  src="./asstes/image/banner-img/banner-btn.png"
                  alt=""
                />

                <h2
                  class="absolute inset-0 lg:-top-4 -top-2 flex items-center justify-center font-medium text-xl md:text-2xl lg:text-4xl text-white"
                >
                  Home | Contact
                </h2>
              </div>
            </div>

            <!-- img div -->
            <div class="w-48 sm:w-64 md:w-auto">
              <img
                class="w-full md:w-auto drop-shadow-[0_0_20px_#06D86E] drop-shadow-[0_0_45px_#06D86E]"
                src="./asstes/image/banner-img/banner-r.png"
                alt=""
              />
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- js link -->
    <script src="/asstes/js/script.js"></script>
  </body>
</html>
