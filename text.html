<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template</title>
    <!-- css link -->
    <link rel="stylesheet" href="/asstes/css/style.css" />
    <!--tailwind css link -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- google fonts -->
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet"> -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <!-- topbar -->
      <section
        class="outfit text-white py-4 md:py-5 flex items-center"
        style="
          background-image: url(./asstes/images/nav-img/nav-bg.png);
          background-size: cover;
          background-position: center;
        "
      >
        <div
          class="w-[90%] mx-auto text-white flex flex-col lg:flex-row items-center justify-between gap-5 lg:gap-8"
        >
          <!-- text div -->
          <div
            class="flex flex-col sm:flex-row flex-wrap items-center justify-center gap-3 sm:gap-4 lg:gap-5"
          >
            <!-- location -->
            <div class="flex items-center gap-2">
              <img
                class="w-5 h-5 object-contain shrink-0"
                src="./asstes/images/nav-img/location.png"
                alt="location"
              />

              <h5 class="text-base whitespace-nowrap">
                123 Business Street, kolkata, NY 10001, IND
              </h5>
            </div>

            <!-- separator -->
            <div class="hidden sm:block h-5 w-px bg-white"></div>

            <!-- GMAIL -->
            <div class="flex items-center gap-2">
              <img
                class="w-5 h-5 object-contain shrink-0"
                src="./asstes/images/nav-img/gmail.png"
                alt="gmail"
              />

              <h5 class="text-base whitespace-nowrap">hello@leadsgorilla.io</h5>
            </div>

            <!-- separator -->
            <div class="hidden sm:block h-5 w-px bg-white"></div>

            <!-- clock -->
            <div class="flex items-center gap-2">
              <img
                class="w-5 h-5 object-contain shrink-0"
                src="./asstes/images/nav-img/clock.png"
                alt="clock"
              />

              <h5 class="text-base whitespace-nowrap">
                Mon - Fri: 09:00 AM - 6:00 PM
              </h5>
            </div>
          </div>

          <!-- icon div -->
          <div class="flex items-center gap-5 sm:gap-8 lg:gap-10">
            <h4 class="text-white text-base whitespace-nowrap">Follow Us:</h4>

            <div class="flex items-center gap-3">
              <!-- Facebook -->
              <div
                class="w-10 h-10 sm:w-12 sm:h-12 p-px rounded-full bg-gradient-to-b from-[#06D86E] to-[#003382]"
              >
                <div
                  class="w-full h-full rounded-full bg-black flex items-center justify-center"
                >
                  <img
                    class="w-6 h-6 sm:w-7 sm:h-7 object-contain"
                    src="./asstes/images/nav-img/fb.png"
                    alt="facebook"
                  />
                </div>
              </div>

              <!-- Instagram -->
              <div
                class="w-10 h-10 sm:w-12 sm:h-12 p-px rounded-full bg-gradient-to-b from-[#06D86E] to-[#003382]"
              >
                <div
                  class="w-full h-full rounded-full bg-black flex items-center justify-center"
                >
                  <img
                    class="w-6 h-6 sm:w-7 sm:h-7 object-contain"
                    src="./asstes/images/nav-img/insta.png"
                    alt="instagram"
                  />
                </div>
              </div>

              <!-- LinkedIn -->
              <div
                class="w-10 h-10 sm:w-12 sm:h-12 p-px rounded-full bg-gradient-to-b from-[#06D86E] to-[#003382]"
              >
                <div
                  class="w-full h-full rounded-full bg-black flex items-center justify-center"
                >
                  <img
                    class="w-6 h-6 sm:w-7 sm:h-7 object-contain"
                    src="./asstes/images/nav-img/linkedin.png"
                    alt="linkedin"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <!-- navbar -->
      <nav></nav>
    </header>
    <main>
      <!-- banner -->
      <!-- banner -->
      <section
        class="outfit text-white flex items-center h-auto md:h-96"
        style="
          background-image:
            url(./asstes/images/banner/banner-bg.png),
            url(./asstes/images/banner/dark-bg.png);
          background-size: cover, cover;
          background-position: center, center;
          background-repeat: no-repeat, no-repeat;
        "
      >
        <div
          class="flex items-center h-auto md:h-96 w-full py-12 md:py-0"
          style="
            background-image: url(./asstes/images/banner-img/banner-bg.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100%;
          "
        >
          <div
            class="w-[90%] mx-auto flex flex-col md:flex-row items-center justify-between gap-10 md:gap-0"
          >
            <!-- text div -->
            <div class="relative flex flex-col items-center">
              <!-- Contact Us -->
              <h2
                class="text-5xl md:text-6xl lg:text-7xl font-extrabold text-white text-center"
              >
                CONTACT <span class="text-[#06D86E]">US</span>
              </h2>

              <!-- Button -->
              <div class="relative mt-6 md:mt-2">
                <img
                  class="w-56 md:w-auto"
                  src="./asstes/images/banner-img/banner-btn.png"
                  alt=""
                />

                <h2
                  class="absolute inset-0 flex items-center justify-center font-medium text-2xl md:text-4xl text-white"
                >
                  Home | Contact
                </h2>
              </div>
            </div>

            <!-- img div -->
            <div class="w-48 sm:w-64 md:w-auto">
              <img
                class="w-full md:w-auto drop-shadow-[0_0_20px_#06D86E] drop-shadow-[0_0_45px_#06D86E]"
                src="./asstes/images/banner-img/banner-r.png"
                alt=""
              />
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- js link -->
    <script src="/asstes/js/script.js"></script>
  </body>
</html>
